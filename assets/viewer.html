<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob: data:; worker-src 'self'; base-uri 'none'; form-action 'none'">
  <title>꼬미 문서 뷰어</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #efefee; color: #262520; font: 16px/1.65 system-ui, sans-serif; }
    #viewer { padding: 8px; }
    .image-viewer { display: grid; place-items: center; min-height: 100dvh; }
    .image-viewer img {
      display: block; max-width: 100%; max-height: calc(100dvh - 16px);
      object-fit: contain; -webkit-user-select: none; user-select: none;
    }
    .image-viewer.image-original { justify-items: safe center; }
    .image-viewer.image-original img { max-width: none; max-height: none; }
    .page, .other-document-page, .other-pdf-page { width: min(100%, 960px); margin: 0 auto 10px; background: white; box-shadow: 0 1px 5px #0002; }
    .page { position: relative; }
    .hwp-matches { position: absolute; inset: 0; pointer-events: none; }
    .hwp-matches span { position: absolute; background: #ffd53b66; }
    .hwp-matches .selected { background: #ffa82b99; }
    .page > img, .other-pdf-page > canvas { display: block; width: 100%; height: auto; }
    .page > img { -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
    .hwp-selectable-text {
      position: absolute; inset: 0; overflow: clip; container-type: inline-size;
      white-space: pre; font-size: 0; line-height: 0;
    }
    .hwp-selectable-text > span {
      position: absolute; color: transparent; font-family: sans-serif; white-space: pre;
      transform-origin: left center; text-size-adjust: none; -webkit-text-size-adjust: none;
      -webkit-user-select: text; user-select: text;
    }
    .hwp-selectable-text > span::selection { color: transparent; background: #619bff66; }
    body:has(.other-pdf-page) { background: #9e9e9e; }
    .other-pdf-page { position: relative; overflow: clip; }
    .pdf-text-layer {
      position: absolute; inset: 0; overflow: clip; text-align: start; line-height: 1;
      direction: ltr; transform-origin: 0 0; text-size-adjust: none; -webkit-text-size-adjust: none;
      --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size));
      --min-font-size-inv: calc(1 / var(--min-font-size));
    }
    .pdf-text-layer[data-main-rotation="90"] { transform: rotate(90deg) translateY(-100%); }
    .pdf-text-layer[data-main-rotation="180"] { transform: rotate(180deg) translate(-100%, -100%); }
    .pdf-text-layer[data-main-rotation="270"] { transform: rotate(270deg) translateX(-100%); }
    .pdf-text-layer > :is(span, br) {
      position: absolute; color: transparent; white-space: pre; transform-origin: 0 0;
      font-size: calc(var(--text-scale-factor) * var(--font-height, 0px));
      transform: rotate(var(--rotate, 0deg)) scaleX(var(--scale-x, 1)) scale(var(--min-font-size-inv));
      -webkit-user-select: text; user-select: text;
    }
    .pdf-text-layer.pdf-copy-disabled, .pdf-text-layer.pdf-copy-disabled > :is(span, br) {
      -webkit-user-select: none; user-select: none;
    }
    .pdf-text-layer .highlight { background: #ffd50059; border-radius: 2px; }
    .pdf-text-layer .highlight.selected { background: #ffa000a6; scroll-margin-top: 32px; }
    .other-document-page { padding: 16px; overflow-wrap: anywhere; }
    .other-document-page img { max-width: 100%; height: auto; }
    .other-table { max-width: 100%; overflow: auto; }
    .other-table table, .other-document-page table { border-collapse: collapse; }
    th, td { border: 1px solid #d5d2ce; padding: 4px 8px; text-align: start; }
    .other-text { white-space: pre-wrap; overflow-wrap: anywhere; }
    .hwp-print-document { display: none; }
    @media print {
      @page kkomi-hwp { margin: 0; }
      body { background: white; }
      #viewer, .other-document-page { padding: 0; margin: 0; box-shadow: none; }
      .hwp-print-ready #viewer { display: none; }
      .hwp-print-ready .hwp-print-document { display: block; page: kkomi-hwp; }
      .hwp-print-document > img {
        display: block; width: 100%; height: calc(100vh - 1px);
        object-fit: contain; object-position: center; break-inside: avoid; break-after: page;
      }
      .hwp-print-document > img:last-child { break-after: auto; }
    }
  </style>
  <script type="module" src="js/viewer.js"></script>
</head>
<body>
  <main id="viewer" aria-label="문서"></main>
</body>
</html>
