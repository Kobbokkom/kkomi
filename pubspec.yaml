name: kkomi
description: 꼬미 통합 문서 뷰어
publish_to: none
version: 1.0.7+36

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  docx_creator: 1.1.2
  google_mobile_ads: ^9.2.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/viewer.html
    - assets/images/
    - assets/js/
    - assets/js/vendor/
    - assets/js/vendor/pdf/
    - assets/js/vendor/pdf/cmaps/
    - assets/js/vendor/pdf/standard_fonts/
    - assets/js/vendor/pdf/iccs/
    - assets/js/vendor/pdf/wasm/
    - assets/fonts/Pretendard-OFL.txt
    - assets/fonts/NotoSansCJK-OFL.txt
    - tools/hwp-policy/THIRD_PARTY_NOTICES.txt
    - tools/odr/7.7.0.patch
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
    - family: Noto Sans CJK
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-Regular.otf
